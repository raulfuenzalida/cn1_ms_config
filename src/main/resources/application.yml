server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ms-config
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/config_db
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:database/init.sql
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/14c46308-ab91-4693-b0c0-daddd7a8aab5/v2.0
          audiences:
            - api://80bf85e9-a444-4754-b780-c65dfff74876
            - 80bf85e9-a444-4754-b780-c65dfff74876

aws:
  region: ${AWS_REGION:us-east-1}

kinesis:
  stream:
    filament-consumption: ${KINESIS_STREAM_FILAMENT_CONSUMPTION:printworks.filament-consumption}
    filament-consumption-dls: ${KINESIS_STREAM_FILAMENT_CONSUMPTION_DLS:printworks.filament-consumption-dls}
  consumer:
    app-name: ${KINESIS_CONSUMER_APP_NAME:ms-config-filament-inventory}
    poll-interval-ms: ${KINESIS_CONSUMER_POLL_INTERVAL_MS:2000}
    initial-delay-ms: ${KINESIS_CONSUMER_INITIAL_DELAY_MS:5000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    duoc.cn1.ms_config: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
